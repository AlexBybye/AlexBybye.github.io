<!DOCTYPE html>
<html>
  <head>
    <meta charset=\
utf-8\>
    <title>Yb's Personal Web</title>
    <script type=\text/javascript\>
      // SPA路由重定向
      (function(){
        var redirect = sessionStorage.getItem('redirect');
        var loc = window.location;
        var uri = loc.hash.substr(1);
        if (redirect !== null) {
          sessionStorage.removeItem('redirect');
          window.location.replace(redirect);
          if(loc.search.length > 0) {
            uri += loc.search;
          }
          setTimeout(function(){
            window.location.hash = uri;
          }, 1);
        } else {
          sessionStorage.setItem('redirect', loc.href);
          window.location.replace(loc.origin + loc.pathname + loc.search);
        }
      })();
    </script>
  </head>
  <body>
  </body>
</html>
